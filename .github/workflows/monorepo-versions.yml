name: Monorepo Versions

# Per-module/per-directory semantic versioning for multi-module monorepos (e.g.
# hydn-co/substrate). Uses GitVersion v6's native monorepo support: each module
# has its own <module>/GitVersion.yml combining `tag-prefix: '<module>/v'` (an
# independent version stream) and `ignore.paths` (so only commits touching the
# module's directory closure bump its version). Computes the module's semVer and,
# optionally, creates+pushes the <module>/v<semVer> tag.
#
# Distinct from version.yml (single repo-root version) — do NOT fold this in there;
# existing single-version consumers depend on version.yml's no-input contract.

on:
  workflow_call:
    inputs:
      module:
        description: "Module/directory name (e.g. 'mux'). Config: <module>/GitVersion.yml; tags: <module>/vX.Y.Z."
        required: true
        type: string
      config-file-path:
        description: "Override path to the module's GitVersion.yml. Default: <module>/GitVersion.yml."
        required: false
        type: string
        default: ""
      create-tag:
        description: "When true, create+push the <module>/v<semVer> tag (idempotent)."
        required: false
        type: boolean
        default: false
      ref:
        description: >-
          Commit or ref to version and tag. Blank (default) checks out the caller's
          triggering commit, which is the existing behaviour. Set it when the caller
          creates a commit that must itself be tagged — a monorepo release that first
          rewrites intra-repo requires to the versions it is about to publish cannot
          otherwise tag the commit carrying them, because this workflow's own checkout
          would land on the pre-rewrite commit.
        required: false
        type: string
        default: ""
    outputs:
      semVer:
        description: "Computed semantic version for the module (no prefix, e.g. 1.0.21)"
        value: ${{ jobs.version.outputs.semVer }}
      majorMinorPatch:
        description: "Major.Minor.Patch for the module"
        value: ${{ jobs.version.outputs.majorMinorPatch }}
      fullSemVer:
        description: "Full semantic version including prerelease/metadata"
        value: ${{ jobs.version.outputs.fullSemVer }}
      tag:
        description: "The created/existing <module>/v<semVer> tag (when create-tag=true)"
        value: ${{ jobs.version.outputs.tag }}
      created:
        description: "Whether a NEW tag was pushed (true) vs it already existed / no-op (false). Empty when create-tag=false."
        value: ${{ jobs.version.outputs.created }}

permissions:
  contents: write

jobs:
  version:
    name: Version ${{ inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      semVer: ${{ steps.gv.outputs.semVer }}
      majorMinorPatch: ${{ steps.gv.outputs.majorMinorPatch }}
      fullSemVer: ${{ steps.gv.outputs.fullSemVer }}
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      # An empty `ref` is checkout's own default, so unset behaves exactly as before.
      # GitVersion and create-tag both read the resulting HEAD, so this input decides
      # which commit gets versioned AND which one gets tagged — they cannot diverge.
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Explicit because a SHA `ref` narrows what checkout fetches, and GitVersion
          # silently falls back to 0.0.1 with no base tag to read — a wrong version is
          # worse than a failed run.
          fetch-tags: true
          ref: ${{ inputs.ref }}

      # GitVersion does not fail when it cannot find a base tag — it returns 0.0.1. With
      # create-tag that publishes a wrong version silently, which is worse than a broken
      # run: consumers resolve it, and nothing points at the mistake afterwards. So assert
      # the precondition instead of trusting the output.
      #
      # Checking for a visible tag covers both ways this happens: a module that was never
      # seeded, and tags that exist but were not fetched (a narrow checkout, e.g. a SHA
      # `ref` without fetch-tags). The second is invisible in the version number alone.
      #
      # Only when actually cutting a tag. Callers that pass create-tag: false use semVer
      # for something else and can legitimately have no tag at all -- substrate's
      # fazure-image.yml computes a version for a container image tag, and fazure has no
      # fazure/v* tag by design because it releases as an image, not a go module. Failing
      # those would break a working release to guard a risk they do not carry: no git tag
      # is cut, so nothing enters a module graph and no consumer resolves it.
      - name: Require a base tag
        if: ${{ inputs.create-tag }}
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          base="$(git tag --list "${MODULE}/v*" --sort=-v:refname | head -n1)"
          if [ -z "$base" ]; then
            echo "::error::No ${MODULE}/v* tag is visible, so GitVersion has no base and would return 0.0.1 — publishing a wrong version rather than failing. Either seed the first tag (git tag ${MODULE}/v0.1.0 && git push origin ${MODULE}/v0.1.0), or check that tags reached this checkout (fetch-tags / fetch-depth)."
            exit 1
          fi
          echo "base tag: $base"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.7.x"

      - name: Calculate Version
        id: gv
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          # GitVersion 6 / gittools v4 dropped `useConfigFile`; passing
          # configFilePath alone selects the per-module config.
          configFilePath: ${{ inputs.config-file-path != '' && inputs.config-file-path || format('{0}/GitVersion.yml', inputs.module) }}

      - name: Create module tag
        id: tag
        if: ${{ inputs.create-tag }}
        uses: hydn-co/build-tools/.github/actions/create-tag@main
        with:
          semver: ${{ steps.gv.outputs.semVer }}
          prefix: ${{ format('{0}/', inputs.module) }}

      # Self-report this module's outcome into the run summary so callers (e.g. the
      # substrate release matrix) surface published-vs-no-op per leg without anyone
      # reading create-tag's step logs. `created` distinguishes a real publish from
      # an idempotent no-op (existing tag).
      - name: Summarize module release
        if: ${{ inputs.create-tag }}
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          TAG: ${{ steps.tag.outputs.tag }}
          CREATED: ${{ steps.tag.outputs.created }}
        run: |
          set -euo pipefail
          if [ "$CREATED" = "true" ]; then status="published ✅"; else status="no-op (tag already existed)"; fi
          echo "### \`$MODULE\` → \`$TAG\` — $status" >> "$GITHUB_STEP_SUMMARY"
