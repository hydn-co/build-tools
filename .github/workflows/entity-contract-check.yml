name: Entity Contract Check

# Reusable workflow for mesh-connector repositories. Verifies that
# internal/collectors/entity_contract_test.go exists and contains a
# When{X}Collector...Runs contract test for every entity collector
# feature declared in the connector manifest. The coverage check is
# static — the tests themselves run in the caller's regular
# `go test ./...` job — but the manifest is gitignored in connector
# repos, so it is regenerated here via `go run ./cmd/... -describe`,
# which needs Go plus private-module auth.
#
# Usage (in a connector's ci.yml):
#
#   jobs:
#     entity-contract:
#       uses: hydn-co/build-tools/.github/workflows/entity-contract-check.yml@main
#       secrets: inherit
#
# `secrets: inherit` is required so setup-go-private can mint a token
# from the org's MESH_MODULES_APP_* secrets.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  entity-contract:
    name: Entity contract coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup private modules
        uses: hydn-co/build-tools/.github/actions/setup-go-private@main
        with:
          client-id: ${{ secrets.MESH_MODULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.MESH_MODULES_APP_KEY }}

      - name: Generate manifest
        run: go run ./cmd/... -describe

      - name: Verify entity contract test coverage
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          import pathlib
          import re
          import sys

          # -describe writes manifest.json at the repo root (gitignored)
          manifest_path = next(
              (p for p in (pathlib.Path("manifest.json"), pathlib.Path("cmd/manifest.json")) if p.exists()),
              None,
          )
          if manifest_path is None:
              sys.exit("::error::no manifest.json found; did the Generate manifest step run?")

          manifest = json.loads(manifest_path.read_text())
          prefix = manifest["name"].removeprefix("mesh-").replace("-", "_") + "_"

          def middle(name):
              # jira_user_entity_collector -> user, collect_users -> users,
              # slack_channels_collector -> channels
              for suffix in ("_entity_collector", "_collector"):
                  if name.endswith(suffix):
                      name = name.removesuffix(suffix)
                      break
              return name.removeprefix(prefix).removeprefix("collect_")

          # An entity collector is a collector that does NOT emit to the shared "activity"
          # space. Newer manifests declare per-feature "spaces"; when present, activity-space
          # membership is the reliable signal, because resume_behavior alone misclassifies a
          # stateless snapshot activity collector (it emits to "activity" but resumes "none").
          # Fall back to the resume_behavior heuristic for older manifests generated before
          # per-feature spaces existed (those connectors have no stateless activity collectors).
          def is_entity_collector(feature):
              if feature.get("type") != "collector":
                  return False
              feature_spaces = feature.get("spaces")
              if feature_spaces is not None:
                  return "activity" not in feature_spaces
              return feature.get("resume_behavior") == "none"

          collectors = [
              middle(name)
              for name, feature in manifest["features"].items()
              if is_entity_collector(feature)
          ]

          if not collectors:
              print(f"OK: {manifest_path} declares no entity collector features; nothing to check")
              sys.exit(0)

          test_file = pathlib.Path("internal/collectors/entity_contract_test.go")
          if not test_file.exists():
              sys.exit(
                  f"::error::{test_file} is missing but {manifest_path} declares "
                  f"{len(collectors)} entity collector feature(s); every connector with entity "
                  "collectors must ship entity contract tests (see the connector bootstrap "
                  "guide, section 'Entity emission contract tests')"
              )

          # Contract tests follow TestShould...When{X}Collector...Runs. Compare case-insensitively
          # with underscores removed so acronym casing (Iam vs IAM) never matters, and tolerate
          # singular test names for plural feature names (collect_users -> WhenUserCollectorRuns).
          tests = test_file.read_text().lower()

          def variants(m):
              v = {m}
              if m.endswith("ies"):
                  v.add(m[:-3] + "y")
              if m.endswith("s"):
                  v.add(m[:-1])
              return v

          missing = [
              c for c in collectors
              if not any(
                  re.search(rf"when{v.replace('_', '')}collector\w*runs", tests)
                  for v in variants(c)
              )
          ]
          if missing:
              sys.exit(
                  f"::error::entity collector feature(s) without a When{{X}}Collector...Runs "
                  f"contract test in {test_file}: {', '.join(sorted(missing))}"
              )

          print(f"OK: all {len(collectors)} entity collector feature(s) covered by {test_file}")
          EOF
