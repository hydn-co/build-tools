name: "Deploy Bicep Template"
description: "Deploys Azure Bicep template using subscription-scoped deployment"

inputs:
  environment:
    description: "Target environment name (e.g., dev1, prod)"
    required: true
  name:
    description: "Deployment name (will be suffixed with environment)"
    required: true
  semver:
    description: "Semantic version to deploy (e.g., v1.2.3 or 1.2.3-alpha.1). Leading 'v' is optional."
    required: true
  applyCerts:
    description: "Whether to apply certificates (true/false)"
    required: false
    default: "false"
  location:
    description: "Azure region for deployment metadata"
    required: false
    default: "eastus"
  template:
    description: "Path to Bicep template file"
    required: false
    default: "./.deploy/bicep/main.bicep"
  parameters:
    description: "Path to Bicep parameters file (will append environment if not full path)"
    required: false
    default: "./.deploy/bicep/params"
  verify-deployment:
    description: "Whether to verify deployment status after completion (true/false)"
    required: false
    default: "true"
  extra-parameters:
    description: |
      Optional additional Bicep parameter overrides, one `key=value` per line.
      Values may be scalars (`logLevel=debug`) or inline JSON for object/array
      parameters (`extraEnv=[{"name":"FOO","value":"bar"}]`). Appended to the
      deployment after applyCerts/semver, so consumers can inject environment-specific
      parameters at deploy time without changing this action. The referenced
      parameters must be declared in the template.
    required: false
    default: ""
  client-id:
    description: |
      Azure AD app (client) ID used for OIDC login. When set together with
      tenant-id and subscription-id, the action re-authenticates periodically
      while polling a long-running deployment, so a slow deployment (e.g. cert
      issuance) can't outlive the Azure access token obtained by the workflow's
      initial azure/login step. Requires the calling job to have
      `permissions: id-token: write`. Leave unset to keep the previous
      single blocking `az deployment sub create` behavior.
    required: false
    default: ""
  tenant-id:
    description: "Azure AD tenant ID, used for periodic re-authentication (see client-id)."
    required: false
    default: ""
  subscription-id:
    description: "Azure subscription ID, used for periodic re-authentication (see client-id)."
    required: false
    default: ""

outputs:
  deployment-name:
    description: "Full deployment name used"
    value: ${{ steps.deploy.outputs.deployment-name }}
  deployment-id:
    description: "Azure deployment resource ID"
    value: ${{ steps.deploy.outputs.deployment-id }}
  provisioning-state:
    description: "Deployment provisioning state (Succeeded/Failed)"
    value: ${{ steps.deploy.outputs.provisioning-state }}

runs:
  using: "composite"
  steps:
    - name: Deploy Bicep Template
      id: deploy
      shell: bash
      env:
        NAME: ${{ inputs.name }}-${{ inputs.environment }}
        LOCATION: ${{ inputs.location }}
        TEMPLATE: ${{ inputs.template }}
        PARAMETERS: ${{ inputs.parameters }}
        ENVIRONMENT: ${{ inputs.environment }}
        APPLY_CERTS: ${{ inputs.applyCerts }}
        SEMVER: ${{ inputs.semver }}
        VERIFY_DEPLOYMENT: ${{ inputs.verify-deployment }}
        EXTRA_PARAMETERS: ${{ inputs.extra-parameters }}
        REAUTH_CLIENT_ID: ${{ inputs.client-id }}
        REAUTH_TENANT_ID: ${{ inputs.tenant-id }}
        REAUTH_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
      run: |
        set -euo pipefail

        # Validate inputs
        echo "🔍 Validating inputs..."
        # Accept semver with optional leading 'v' and optional prerelease/build metadata
        if [[ ! "$SEMVER" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
          echo "❌ ERROR: Invalid semver format '$SEMVER'. Expected a semantic version like 'v1.2.3' or '1.2.3-alpha.1'"
          exit 1
        fi

        if [[ ! "$APPLY_CERTS" =~ ^(true|false)$ ]]; then
          echo "❌ ERROR: Invalid applyCerts value '$APPLY_CERTS'. Must be 'true' or 'false'."
          exit 1
        fi

        if [[ ! "$VERIFY_DEPLOYMENT" =~ ^(true|false)$ ]]; then
          echo "❌ ERROR: Invalid verify-deployment value '$VERIFY_DEPLOYMENT'. Must be 'true' or 'false'."
          exit 1
        fi

        # Verify Azure CLI is logged in
        echo "🔍 Verifying Azure CLI authentication..."
        if ! az account show >/dev/null 2>&1; then
          echo "❌ ERROR: Not logged in to Azure CLI"
          echo "   Run 'az login' or ensure OIDC authentication is configured."
          exit 1
        fi

        SUBSCRIPTION=$(az account show --query name -o tsv)
        SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        echo "✅ Authenticated to subscription: $SUBSCRIPTION"

        # Determine parameters file path
        if [[ "$PARAMETERS" == *.bicepparam ]]; then
          PARAMS_FILE="$PARAMETERS"
        else
          PARAMS_FILE="${PARAMETERS}/${ENVIRONMENT}.bicepparam"
        fi

        # Verify template file exists
        if [[ ! -f "$TEMPLATE" ]]; then
          echo "❌ ERROR: Bicep template not found at $TEMPLATE"
          echo "   Current directory: $(pwd)"
          ls -la .deploy/bicep/ 2>/dev/null || echo "   .deploy/bicep/ directory not found"
          exit 1
        fi

        # Verify parameters file exists
        if [[ ! -f "$PARAMS_FILE" ]]; then
          echo "❌ ERROR: Parameters file not found at $PARAMS_FILE"
          echo "   Available parameter files:"
          ls -la "${PARAMETERS}/" 2>/dev/null || echo "   ${PARAMETERS}/ directory not found"
          exit 1
        fi

        echo "🚀 Deploying Bicep template"
        echo "  Name: $NAME"
        echo "  Location: $LOCATION"
        echo "  Template: $TEMPLATE"
        echo "  Parameters: $PARAMS_FILE"
        echo "  Version: $SEMVER"
        echo "  Apply Certs: $APPLY_CERTS"

        # Parse optional extra Bicep parameter overrides (one key=value per line).
        EXTRA_ARGS=()
        if [[ -n "${EXTRA_PARAMETERS:-}" ]]; then
          while IFS= read -r raw; do
            # Trim surrounding whitespace via parameter expansion (xargs would strip
            # the quotes/brackets from inline JSON values such as arrays/objects).
            line="$raw"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [[ -z "$line" ]] && continue
            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "❌ ERROR: Invalid extra parameter '$line'. Expected 'key=value'."
              exit 1
            fi
            EXTRA_ARGS+=("$line")
          done <<< "$EXTRA_PARAMETERS"
          [[ ${#EXTRA_ARGS[@]} -gt 0 ]] && echo "  Extra params: ${EXTRA_ARGS[*]}"
        fi

        # Re-authentication helper: a long-running deployment (e.g. cert issuance)
        # can outlive the Azure access token obtained by the workflow's initial
        # azure/login step, since that token was minted from a short-lived GitHub
        # OIDC assertion that az CLI cannot silently refresh on its own
        # (AADSTS700024: "Client assertion is not within its valid time range").
        # When re-auth params are provided, fetch a *fresh* OIDC token from GitHub
        # and re-login with it before the cached token can expire.
        REAUTH_ENABLED=false
        if [[ -n "${REAUTH_CLIENT_ID:-}" && -n "${REAUTH_TENANT_ID:-}" && -n "${REAUTH_SUBSCRIPTION_ID:-}" ]]; then
          REAUTH_ENABLED=true
        fi

        reauth() {
          echo "🔁 Refreshing Azure OIDC login before token expiry..."
          local id_token
          id_token=$(curl -sLS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          if [[ -z "$id_token" || "$id_token" == "null" ]]; then
            echo "⚠️  Warning: failed to fetch a fresh OIDC token; continuing with existing login"
            return
          fi
          az login --service-principal \
            -u "$REAUTH_CLIENT_ID" \
            -t "$REAUTH_TENANT_ID" \
            --federated-token "$id_token" \
            --allow-no-subscriptions >/dev/null
          az account set --subscription "$REAUTH_SUBSCRIPTION_ID"
          echo "✅ Re-authenticated"
        }

        # Kick off the deployment asynchronously so this action controls the wait
        # loop (and can refresh auth mid-flight) instead of one blocking az call.
        if ! az deployment sub create \
          --name "$NAME" \
          --location "$LOCATION" \
          --template-file "$TEMPLATE" \
          --parameters "$PARAMS_FILE" \
            applyCerts="$APPLY_CERTS" \
            semver="$SEMVER" \
            ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"} \
          --no-wait; then
          echo ""
          echo "❌ ERROR: Failed to start Bicep deployment"
          echo "   Deployment name: $NAME"
          echo "   Location: $LOCATION"
          echo "   Template: $TEMPLATE"
          echo "   Parameters: $PARAMS_FILE"
          exit 1
        fi

        # Get deployment details
        DEPLOYMENT_ID="/subscriptions/$SUBSCRIPTION_ID/providers/Microsoft.Resources/deployments/$NAME"

        # Set outputs
        echo "deployment-name=$NAME" >> "$GITHUB_OUTPUT"
        echo "deployment-id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

        echo ""
        echo "⏳ Waiting for deployment to complete..."
        PORTAL_URL="https://portal.azure.com/#view/HubsExtension/DeploymentDetailsBlade/~/overview/id/%2Fsubscriptions%2F$SUBSCRIPTION_ID%2Fproviders%2FMicrosoft.Resources%2Fdeployments%2F$NAME"

        POLL_INTERVAL=60
        MAX_WAIT_SECONDS=$((4 * 60 * 60)) # 4h ceiling; cert issuance has taken ~2h before
        REAUTH_INTERVAL_SECONDS=$((40 * 60)) # comfortably under the ~60-75min AAD token lifetime
        ELAPSED=0
        LAST_AUTH=0
        PROVISIONING_STATE="Running"

        while true; do
          if [[ "$REAUTH_ENABLED" == "true" && $((ELAPSED - LAST_AUTH)) -ge $REAUTH_INTERVAL_SECONDS ]]; then
            reauth
            LAST_AUTH=$ELAPSED
          fi

          PROVISIONING_STATE=$(az deployment sub show \
            --name "$NAME" \
            --query properties.provisioningState \
            -o tsv 2>/dev/null || echo "Unknown")

          case "$PROVISIONING_STATE" in
            Succeeded|Failed|Canceled)
              break
              ;;
          esac

          if (( ELAPSED >= MAX_WAIT_SECONDS )); then
            echo "❌ ERROR: Timed out after ${MAX_WAIT_SECONDS}s waiting for deployment (last state: $PROVISIONING_STATE)"
            echo "   Check the Azure Portal for detailed error messages:"
            echo "   $PORTAL_URL"
            echo "provisioning-state=$PROVISIONING_STATE" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          sleep "$POLL_INTERVAL"
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
        done

        echo "provisioning-state=$PROVISIONING_STATE" >> "$GITHUB_OUTPUT"

        if [[ "$PROVISIONING_STATE" != "Succeeded" ]]; then
          echo ""
          echo "❌ ERROR: Bicep deployment finished with state $PROVISIONING_STATE"
          echo "   Deployment name: $NAME"
          echo "   Location: $LOCATION"
          echo "   Template: $TEMPLATE"
          echo "   Parameters: $PARAMS_FILE"
          echo ""
          echo "   Check the Azure Portal for detailed error messages:"
          echo "   $PORTAL_URL"
          exit 1
        fi

        # Verify deployment if requested (state already confirmed above; this
        # additionally surfaces deployment outputs for visibility).
        if [[ "$VERIFY_DEPLOYMENT" == "true" ]]; then
          echo "✅ Deployment verified: $PROVISIONING_STATE"

          OUTPUTS=$(az deployment sub show \
            --name "$NAME" \
            --query properties.outputs \
            -o json 2>/dev/null || echo "{}")

          if [[ "$OUTPUTS" != "{}" ]]; then
            echo ""
            echo "📤 Deployment outputs:"
            echo "$OUTPUTS" | jq '.'
          fi
        fi

        echo "✅ Deployment completed successfully"

        # Start Container App(s) if template outputs containerAppName (convention; comma-separated for multiple)
        echo ""
        RG="rg-$ENVIRONMENT"
        APP_NAMES=$(az deployment sub show --name "$NAME" --query "properties.outputs.containerAppName.value" -o tsv 2>/dev/null || true)
        if [[ -n "$APP_NAMES" ]]; then
          IFS=',' read -ra apps <<< "$APP_NAMES"
          for app in "${apps[@]}"; do
            app=$(echo "$app" | xargs)
            [[ -z "$app" ]] && continue
            echo "▶️  Starting Container App: $app"
            az rest --method post \
              --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/$app/start?api-version=2025-01-01" \
              --only-show-errors
          done
          echo "   Start requested."
        fi
