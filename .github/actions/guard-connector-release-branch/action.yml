name: Guard connector release branch
description: >-
  Validates release context before publishing. GitVersion and release-advancement checks decide whether the ref is actually publishable.

runs:
  using: composite
  steps:
  - name: Validate release context
    shell: bash
    run: |
      set -euo pipefail
      REF_NAME="${{ github.ref_name }}"
      DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

      if [[ -z "$DEFAULT_BRANCH" ]]; then
        echo "::error::github.event.repository.default_branch is empty; cannot validate release context."
        exit 1
      fi

      echo "::notice::Release ref '${REF_NAME}' accepted; GitVersion will determine the release version."
